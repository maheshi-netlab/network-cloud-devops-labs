name: Network Security Configuration Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-network-config:
    name: Network Security and Python Validation

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Validation Script Executable
        run: chmod +x scripts/validate_network_config.sh

      - name: Run Network Configuration Validation
        run: bash scripts/validate_network_config.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: python -m pip install -r requirements.txt
        working-directory: labs/08-python-rest-api-automation

      - name: Prepare Report Directory
        run: mkdir -p reports
        working-directory: labs/08-python-rest-api-automation

      - name: Run Firewall Analyzer Unit Tests
        run: python -m unittest -v test_firewall_analyzer.py
        working-directory: labs/08-python-rest-api-automation
